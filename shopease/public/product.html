<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – ShopEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header></header>
  <main class="container" id="root"><p class="empty">Loading...</p></main>
  <footer>© 2026 ShopEase</footer>
  <script src="js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let qty = 1, product;
    api('/products/' + id).then(p => {
      product = p; document.title = p.name + ' – ShopEase';
      $('#root').innerHTML = `
      <section class="detail">
        <img src="${p.image}" alt="${p.name}">
        <div>
          <a href="index.html" class="muted">← Back to shop</a>
          <p class="cat" style="margin-top:14px">${p.category}</p>
          <h1>${p.name}</h1>
          <p class="price">${money(p.price)}</p>
          <p>${p.description}</p>
          <p class="muted" style="margin-top:10px">${p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'}</p>
          <div class="qty">
            <button onclick="setQty(-1)">−</button><strong id="q">1</strong><button onclick="setQty(1)">+</button>
          </div>
          <button class="btn" ${p.stock ? '' : 'disabled'} onclick="Cart.add(product, qty)">Add to cart</button>
          <a href="cart.html" class="btn outline" style="margin-left:8px">Go to cart</a>
        </div>
      </section>`;
    }).catch(e => $('#root').innerHTML = `<p class="empty">${e.message}</p>`);
    function setQty(d) { qty = Math.min(product.stock, Math.max(1, qty + d)); $('#q').textContent = qty; }
  </script>
</body>
</html>
