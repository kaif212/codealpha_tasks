<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ShopEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header></header>
  <main class="container">
    <div class="auth panel">
      <h2>Welcome back</h2>
      <p class="muted">Login to continue shopping</p>
      <form id="f">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button class="btn">Login</button>
      </form>
      <p class="muted" style="margin-top:14px">New here? <a href="register.html" style="color:var(--primary)">Create account</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    $('#f').onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        Auth.save(await api('/auth/login', { method: 'POST', body: JSON.stringify(body) }));
        location.href = new URLSearchParams(location.search).get('next') || 'index.html';
      } catch (err) { toast(err.message); }
    };
  </script>
</body>
</html>
