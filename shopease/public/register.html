<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up – ShopEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header></header>
  <main class="container">
    <div class="auth panel">
      <h2>Create account</h2>
      <p class="muted">Join ShopEase in seconds</p>
      <form id="f">
        <input name="name" placeholder="Full name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password (min 6 chars)" minlength="6" required />
        <button class="btn">Sign up</button>
      </form>
      <p class="muted" style="margin-top:14px">Already have an account? <a href="login.html" style="color:var(--primary)">Login</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    $('#f').onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        Auth.save(await api('/auth/register', { method: 'POST', body: JSON.stringify(body) }));
        location.href = 'index.html';
      } catch (err) { toast(err.message); }
    };
  </script>
</body>
</html>
